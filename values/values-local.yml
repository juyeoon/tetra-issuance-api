# =====================================================================
# Issuance Service — 로컬(docker-compose) 환경 values
# ---------------------------------------------------------------------
# Helm values.yaml 처럼 "환경마다 달라지는 값"만 여기에 모은다.
#  - application.yml 은 구조와 ${values.*} 참조만 갖고, 실제 값은 이 파일에서 읽는다.
#  - 값을 바꿀 때는 이 파일만 고친다. 새 변수를 추가하면
#    MVP/API/PLAN&DATA 의 계획·진행 문서 설정 표에도 같이 추가한다.
#  - dev/prod 는 values-dev.yml / values-prod.yml 로 추가하고,
#    비밀값은 EKS Secret(환경변수)으로 덮어쓴다.
# =====================================================================
values:

  # --- 이 Pod가 맡는 테넌트·이벤트 (MVP 계획 A2 — 이벤트마다 API Deployment 하나) -----
  # 배포에서는 event 차트가 환경변수 VALUES_TENANT_ID · VALUES_EVENT_ID 로 덮어쓴다.
  # DB 스키마는 t_{tenant.id} 로 정해진다 (MVP 물리 ERD — 테넌트별 스키마).
  tenant:
    id: poctenant001

  # --- MySQL (local/docker-compose.yml 의 mysql 서비스와 같은 값) ---------
  db:
    host: localhost
    port: 3306
    username: tetra
    password: tetra            # 로컬 전용. 배포 환경은 Secret 으로 주입
    ssl-mode: PREFERRED        # PREFERRED: 서버가 TLS를 지원하면 TLS, 아니면 평문 (MySQL 드라이버 기본값). 배포(dev)는 REQUIRED
    pool-size: 5               # HikariCP 최대 커넥션 수 (Pod 1개당, B7 확정 2026-10-17)

  # --- Redis / Valkey (docker-compose 의 valkey 서비스) ----------------
  redis:
    host: localhost
    port: 6379

  # --- 시간대 (DB 저장 타임존 KST 와 맞춤, 진행 문서 M0-1 S3) ----------
  timezone: Asia/Seoul

  # --- 종료 (graceful shutdown) -----------------------------------------
  # 처리 중인 요청을 기다리는 최대 시간. 배포는 preStop 15초 + 이 값 < terminationGracePeriodSeconds 45초
  shutdown-timeout: 20s

  # Tomcat keep-alive 유휴 시간 — ALB 유휴 시간(60초)보다 길게
  tomcat-keep-alive-timeout: 65s

  # --- 세션 (D4·D6) ----------------------------------------------------
  session:
    # 세션 발급 후 302 로 보낼 대기방 경로. {eventId} 는 실제 값으로 치환됨.
    # 반드시 "/" 로 시작하는 상대 경로만 (절대 주소·"//" 불가).
    #   CloudFront → ALB 구간에서 Host 가 오리진 주소(origin.gamza-dev.shop)로 바뀌어 들어오므로,
    #   절대 주소를 쓰거나 Host 로 주소를 만들면 브라우저가 오리진으로 이동해 버린다.
    # 대기방(02)은 루트(/). MVP 프런트는 eventId 를 호스트별 event.json 에서만 읽으므로 쿼리 없이 "/" (2026-10-15, MVP 계획 C20)
    redirect-url: /
    cookie-name: TETRA_SID
    ttl: 2h
    cookie-secure: true        # localhost 는 브라우저가 보안 출처로 취급해 Secure 쿠키 허용
    # 입장(세션 발급) OPEN = 이벤트 시작 − 60분 (모든 플랜 고정, event.json entryOpenAt 과 같은 규칙 — 바꾸면 워크플로우 상수도 함께)
    # entry-open-before: 60m   # TEST-LEAD 원래 값
    entry-open-before: 15m     # TEST-LEAD 시험용 임시 (입장 OPEN = 시작 − 15분)
    # 서버 허용 오차: OPEN 60초 전부터 발급 (브라우저 시계가 빠를 때 재입장 반복 방지)
    entry-open-grace: 60s

  # --- 대기열 커서 (플랜 4-3) ------------------------------------------
  queue:
    cursor-step: 300           # 윈도우당 커서 증가량 (부하테스트 후 조정)
    cursor-window: 3s          # 커서 증가 윈도우 = advance-lock TTL
    cursor-cache-s-maxage: 1s  # Cache-Control: public, max-age=0, s-maxage={값}

  # --- 이 Pod가 맡는 이벤트 ------------------------------------------------
  event:
    id: 1                      # 이 Pod가 맡는 이벤트 (배포: VALUES_EVENT_ID)

  # --- JWT (플랜 4-1) --------------------------------------------------
  jwt:
    user-id-max-length: 128
    # 테넌트 서버와 시계가 이만큼 어긋나도 만료 판정을 봐준다 (exp 1~2분 토큰이라 작게)
    clock-skew: 5s
    # exp 가 지금부터 이보다 멀면 거절 (1년짜리 토큰 같은 비정상 토큰 차단, jti 키 수명도 이 안으로 제한)
    max-ttl: 5m
    # 테스트 JWT 서명용 개인키 (로컬 전용, scripts/gen-test-keys.sh 로 생성).
    # 상대 경로는 저장소 루트에서 실행할 때 기준.
    test-private-key-path: local/keys/test-jwt-private.pem

  # --- 헬스체크 (Actuator) ---------------------------------------------
  management:
    port: 8081                 # 관리 포트 (B6) — liveness·readiness·prometheus
    # /actuator/health 응답에 db·redis 같은 구성요소별 상태를 보여줄지.
    # always: 로컬 디버깅용 / never: 배포 환경 권장(내부 구성 노출 방지, 전체 UP·DOWN만 응답)
    health-show-details: always

  # --- 재고 워밍업 (플랜 4-4) ------------------------------------------
  stock:
    # if-absent: Redis 에 재고 키가 없을 때만 MySQL stock_count 로 채움 (재기동해도 차감분 유지)
    # force    : 항상 덮어씀 (로컬에서 재고를 처음 상태로 되돌릴 때만)
    #            배포 환경 금지 — Pod 가 뜰 때마다 실행되므로 재시작·스케일아웃 때 재고가 처음으로 돌아감
    warmup-mode: if-absent

  # --- 기동 웜업 (A4) --------------------------------------------------------
  warmup:
    iterations: 100          # 웜업 흐름(입장 → 번호표 → claim, 실제 HTTP) 수 (0 = 끔). 로컬·테스트는 짧게
    concurrency: 8           # 동시에 보내는 수
    max-duration: 25s          # 상한 — 넘으면 남은 반복을 건너뛰고 readiness 로 넘어간다
